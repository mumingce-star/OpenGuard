{
  "ruleset_version": "2026.09.1",
  "rules": [
    {
      "id": "LIC-MIT-NOTICE",
      "version": "1.0.0",
      "license_ids": ["MIT"],
      "severity": "low",
      "title": "复核 MIT 声明保留义务",
      "obligation": {
        "action": "retain_license_notice",
        "trigger": "经核验的 MIT 许可材料被纳入分发内容",
        "description": "分发材料时保留版权声明和许可声明。"
      },
      "remediation": {
        "summary": "分发前确认 MIT 声明的处理方式",
        "steps": ["定位已核验的许可证原文", "在分发材料中保留所需声明"]
      }
    },
    {
      "id": "LIC-APACHE-2.0-NOTICE",
      "version": "1.0.0",
      "license_ids": ["Apache-2.0"],
      "severity": "medium",
      "title": "复核 Apache-2.0 声明与修改义务",
      "obligation": {
        "action": "retain_license_and_notice",
        "trigger": "经核验的 Apache-2.0 材料被再分发或修改",
        "description": "复核许可证及适用 NOTICE 内容的保留情况，并按要求记录实质性修改。"
      },
      "remediation": {
        "summary": "复核 Apache-2.0 分发材料",
        "steps": ["定位 LICENSE 和 NOTICE 证据", "分发前复核修改声明"]
      }
    },
    {
      "id": "LIC-BSD-3-CLAUSE-NOTICE",
      "version": "1.0.0",
      "license_ids": ["BSD-3-Clause"],
      "severity": "low",
      "title": "复核 BSD-3-Clause 声明保留义务",
      "obligation": {
        "action": "retain_bsd_notices",
        "trigger": "经核验的 BSD-3-Clause 材料被再分发",
        "description": "在源代码或二进制再分发材料中保留所需版权、条件和免责声明。"
      },
      "remediation": {
        "summary": "确认 BSD 声明的处理方式",
        "steps": ["定位已核验的 BSD 许可证证据", "在选定分发形式中包含所需声明"]
      }
    },
    {
      "id": "LIC-GPL-3.0-ONLY-COPYLEFT",
      "version": "1.0.0",
      "license_ids": ["GPL-3.0-only"],
      "severity": "high",
      "title": "复核 GPL-3.0-only 传染性许可义务",
      "obligation": {
        "action": "perform_copyleft_distribution_review",
        "trigger": "经核验的 GPL-3.0-only 材料可能被传播或纳入分发作品",
        "description": "传播前由人工复核适用的对应源代码、声明和分发义务。"
      },
      "remediation": {
        "summary": "升级 GPL 分发复核",
        "steps": ["确认预期分发场景", "由获授权的复核人员检查已核验的 GPL 原文"]
      }
    },
    {
      "id": "LIC-CC-BY-4.0-ATTRIBUTION",
      "version": "1.0.0",
      "license_ids": ["CC-BY-4.0"],
      "severity": "medium",
      "title": "复核 CC-BY-4.0 署名要求",
      "obligation": {
        "action": "prepare_attribution",
        "trigger": "经核验的 CC-BY-4.0 材料被共享或改编",
        "description": "共享前复核署名、许可证链接、修改说明及其他适用的署名细节。"
      },
      "remediation": {
        "summary": "准备经过复核的 CC-BY 署名记录",
        "steps": ["收集创作者和许可证证据", "根据预期用途复核署名与修改披露"]
      }
    },
    {
      "id": "LIC-CC-BY-NC-4.0-NONCOMMERCIAL",
      "version": "1.0.0",
      "license_ids": ["CC-BY-NC-4.0"],
      "severity": "high",
      "title": "复核 CC-BY-NC-4.0 非商业性限制",
      "obligation": {
        "action": "review_noncommercial_scope",
        "trigger": "经核验的 CC-BY-NC-4.0 材料拟用于共享或改编",
        "description": "由人工复核预期用途和分发是否符合非商业性条件及署名条款。"
      },
      "remediation": {
        "summary": "升级非商业性用途复核",
        "steps": ["记录预期用途和分发方式", "由获授权的复核人员检查已核验的许可证原文"]
      }
    },
    {
      "id": "LIC-BSD-2-CLAUSE-NOTICE", "version": "1.0.0", "license_ids": ["BSD-2-Clause"], "severity": "low", "title": "复核 BSD-2-Clause 声明保留义务",
      "obligation": {"action": "retain_bsd_notices", "trigger": "经核验的 BSD-2-Clause 材料被再分发", "description": "保留所需版权、条件和免责声明。"},
      "remediation": {"summary": "确认 BSD 声明的处理方式", "steps": ["定位已核验的许可证证据", "在分发材料中包含所需声明"]}
    },
    {
      "id": "LIC-ISC-NOTICE", "version": "1.0.0", "license_ids": ["ISC"], "severity": "low", "title": "复核 ISC 声明保留义务",
      "obligation": {"action": "retain_license_notice", "trigger": "经核验的 ISC 材料被再分发", "description": "保留 ISC 许可声明和免责声明。"},
      "remediation": {"summary": "确认 ISC 声明的处理方式", "steps": ["定位已核验的许可证证据", "保留 ISC 声明"]}
    },
    {
      "id": "LIC-MPL-2.0-FILE-COPYLEFT", "version": "1.0.0", "license_ids": ["MPL-2.0"], "severity": "medium", "title": "复核 MPL-2.0 文件级义务",
      "obligation": {"action": "perform_file_level_copyleft_review", "trigger": "经核验的 MPL-2.0 文件被修改或分发", "description": "复核受覆盖文件适用的源代码提供和声明义务。"},
      "remediation": {"summary": "复核受 MPL 覆盖的文件", "steps": ["识别被修改的受覆盖文件", "分发前进行人工复核"]}
    },
    {
      "id": "LIC-EPL-2.0-RECIPROCAL", "version": "1.0.0", "license_ids": ["EPL-2.0"], "severity": "medium", "title": "复核 EPL-2.0 互惠许可义务",
      "obligation": {"action": "perform_reciprocal_license_review", "trigger": "经核验的 EPL-2.0 材料被分发", "description": "根据预期分发方式复核适用的声明、源代码和互惠许可义务。"},
      "remediation": {"summary": "升级 EPL 分发复核", "steps": ["记录分发场景", "由获授权的复核人员检查已核验的 EPL 证据"]}
    },
    {
      "id": "LIC-LGPL-2.1-ONLY-REVIEW", "version": "1.0.0", "license_ids": ["LGPL-2.1-only"], "severity": "high", "title": "复核 LGPL-2.1-only 许可义务",
      "obligation": {"action": "perform_lgpl_distribution_review", "trigger": "经核验的 LGPL-2.1-only 材料被用于分发作品", "description": "分发前由人工复核链接、声明和源代码义务。"},
      "remediation": {"summary": "升级 LGPL 分发复核", "steps": ["确认链接和分发事实", "复核已核验的 LGPL 证据"]}
    },
    {
      "id": "LIC-GPL-2.0-ONLY-COPYLEFT", "version": "1.0.0", "license_ids": ["GPL-2.0-only"], "severity": "high", "title": "复核 GPL-2.0-only 传染性许可义务",
      "obligation": {"action": "perform_copyleft_distribution_review", "trigger": "经核验的 GPL-2.0-only 材料可能被传播", "description": "传播前由人工复核适用的对应源代码和声明义务。"},
      "remediation": {"summary": "升级 GPL 分发复核", "steps": ["确认预期分发方式", "复核已核验的 GPL 证据"]}
    },
    {
      "id": "LIC-AGPL-3.0-ONLY-NETWORK", "version": "1.0.0", "license_ids": ["AGPL-3.0-only"], "severity": "high", "title": "复核 AGPL-3.0-only 网络使用义务",
      "obligation": {"action": "perform_network_copyleft_review", "trigger": "经核验的 AGPL-3.0-only 材料可能被修改并用于网络交互", "description": "部署前由人工复核适用的源代码提供和声明义务。"},
      "remediation": {"summary": "升级 AGPL 部署复核", "steps": ["确认网络部署事实", "复核已核验的 AGPL 证据"]}
    },
    {
      "id": "LIC-CC0-1.0-ATTRIBUTION-REVIEW", "version": "1.0.0", "license_ids": ["CC0-1.0"], "severity": "info", "title": "复核 CC0-1.0 来源信息",
      "obligation": {"action": "retain_provenance_record", "trigger": "经核验的 CC0-1.0 材料被纳入项目", "description": "保留来源证据，并复核该来源适用的非许可证限制。"},
      "remediation": {"summary": "记录 CC0 来源信息", "steps": ["保留已核验的来源证据", "复核来源特定条款"]}
    },
    {
      "id": "LIC-UNLICENSE-PROVENANCE", "version": "1.0.0", "license_ids": ["Unlicense"], "severity": "info", "title": "复核 Unlicense 来源信息",
      "obligation": {"action": "retain_provenance_record", "trigger": "经核验的 Unlicense 材料被纳入项目", "description": "保留所选材料的来源和许可证证据。"},
      "remediation": {"summary": "记录 Unlicense 来源信息", "steps": ["保留已核验的许可证证据", "复核来源特定声明"]}
    }
  ]
}
