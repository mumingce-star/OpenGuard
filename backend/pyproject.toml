[project]
name = "openguard-backend"
version = "0.1.0"
description = "OpenGuard P0 domain contract implementation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "packaging==26.3",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "jsonschema==4.26.0",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["../tests/unit"]
addopts = "-q"

# Installed API runtime closure: CPython 3.12, Linux amd64.
# Keep project.dependencies unchanged; these are deployment pins, not new features.
[tool.openguard.api-lock]
requirements = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "click==8.5.0",
  "fastapi==0.141.1",
  "h11==0.16.0",
  "idna==3.19",
  "packaging==26.3",
  "pydantic==2.13.4",
  "pydantic_core==2.46.4",
  "python-multipart==0.0.32",
  "starlette==1.6.0",
  "typing-inspection==0.4.4",
  "typing_extensions==4.16.0",
  "uvicorn==0.52.4",
]
